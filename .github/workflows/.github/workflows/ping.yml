name: Ping Server

# Render 무료 플랜은 보통 15분간 요청 없으면 슬립됨.
# 그보다 훨씬 짧은 5분 간격으로 핑을 보내서 항상 깨어있게 유지.
on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 실행
  workflow_dispatch:         # 수동 실행 버튼도 사용 가능 (테스트용)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the server
        run: |
          echo "핑 보내는 시각: $(date)"
          curl -s https://YOUR-RENDER-URL.onrender.com/ || echo "핑 실패!"
